async function keyFrom(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(B.s),iterations:B.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open_(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(B.i)},key,u8(B.c));const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close()}
async function tryPw(pw,remember){const msg=document.getElementById('msg');msg.textContent='解密中…';
try{const key=await keyFrom(pw);await open_(key);if(remember){try{localStorage.setItem('kb_pw',pw)}catch(e){}}}catch(e){msg.textContent='密码不对';try{localStorage.removeItem('kb_pw')}catch(e){}}}
document.getElementById('go').onclick=()=>tryPw(document.getElementById('pw').value,document.getElementById('rm').checked);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});
try{const s=localStorage.getItem('kb_pw');if(s)tryPw(s,true)}catch(e){}
